name: CI

# ── When does this run? ──
# A workflow run is always scoped to the single branch/ref that triggered it,
# so CI only ever runs against the branch you edited or opened a PR for.
#   • push        → fires when you push commits (an "edit") to ANY branch.
#   • pull_request → fires when a PR is opened/updated targeting main or features.
# To restrict pushes to specific branches, replace ['**'] with a list,
# e.g. branches: [main, features, 'feature/**'].
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, features]

# Cancel an in-progress run if newer commits land on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint & format ──
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Biome check
        run: npx @biomejs/biome check .
        continue-on-error: true # repo has known pre-existing Biome noise

  # ── 2. Typecheck (no secrets needed) ──
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck

  # ── 3. Unit tests (Vitest) ──
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Run Vitest
        run: npm test

  # ── 4. Build — only after lint, typecheck and tests pass ──
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Next.js production build
        run: npm run build
        env:
          # Real secrets come from GitHub repo Settings → Secrets → Actions.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
