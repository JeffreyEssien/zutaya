name: CI

# Runs on every push to the main branches and on every PR targeting them.
# This is the quality gate: lint + typecheck/build must pass before merge.
on:
  push:
    branches: [main, features]
  pull_request:
    branches: [main, features]

# Cancel an in-progress run if newer commits are pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint & format check (Biome)
        run: npx @biomejs/biome check .
        continue-on-error: true # repo has known pre-existing Biome noise; don't block on it

      - name: Build (typecheck gate)
        run: npm run build
        env:
          # Build-time env. Real secrets live in GitHub repo Settings → Secrets,
          # surfaced here as ${{ secrets.* }}. Public vars can be literals.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAYSTACK_PUBLIC_KEY: ${{ secrets.PAYSTACK_PUBLIC_KEY }}
          PAYSTACK_SECRET_KEY: ${{ secrets.PAYSTACK_SECRET_KEY }}
