name: Bumpa order sync

# Pulls new Bumpa orders into zutaya and deducts stock. Vercel Hobby caps cron at
# once/day, so this free GitHub scheduler hits the sync endpoint every ~15 minutes.
#
# Setup (Repo → Settings → Secrets and variables → Actions):
#   PRODUCTION_URL  e.g. https://zutaya.vercel.app   (no trailing slash)
#   CRON_SECRET     same value as the CRON_SECRET env var in Vercel
#
# The endpoint enforces `Authorization: Bearer $CRON_SECRET`. Each run is
# idempotent (orders dedupe by Bumpa order id). Trigger manually via "Run workflow".

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: bumpa-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Bumpa sync endpoint
        run: |
          if [ -z "${{ secrets.PRODUCTION_URL }}" ] || [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::PRODUCTION_URL and/or CRON_SECRET repo secrets are not set."
            exit 1
          fi
          curl -fsS -X POST \
            "${{ secrets.PRODUCTION_URL }}/api/bumpa/sync" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --max-time 120 \
            --retry 2 --retry-delay 5
